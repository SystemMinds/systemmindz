    <!-- ===== Growth OS - Conversion Engine (agent #15) =====
         Measures where visitors are lost: the funnel, scroll depth, rage
         clicks, which form field loses people, and conversion rate per traffic
         source. It also serves A/B test variants, which is why it loads in
         <head> rather than at the end of <body> - a variant applied after the
         page paints is a visible flicker, and the flicker only ever happens to
         the treatment half, which biases the test.

         Cookieless and first-party: the visitor id lives in this site's own
         localStorage, no IP is stored, and Do Not Track / Global Privacy
         Control are honoured, so no consent banner is required to run it.

         The key is PUBLIC by design - it is visible to every visitor and can
         only append web events to one company. It is not a secret.

         NOTE FOR DEPLOYMENT: this points at localhost, which only resolves on
         the machine running the Growth OS backend. On the deployed site it
         must become the public HTTPS address of that backend - a browser will
         refuse to load an http:// script into an https:// page, and a
         visitor's "localhost" is their own computer, not your server. -->
    <script src="http://localhost:8787/api/collect/ce.js?k=ck_630af44e4859f49c35eb7eb189eec051" defer></script>
